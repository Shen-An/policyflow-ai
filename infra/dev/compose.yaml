name: policyflow-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-policyflow}
      POSTGRES_USER: ${POSTGRES_USER:-policyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-policyflow-dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - policyflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  pgbouncer:
    # Upstream publishes pgbouncer images with a -pN suffix; the bare "1.24.1"
    # tag does not exist and made `compose up pgbouncer` fail to resolve.
    image: edoburu/pgbouncer:v1.24.1-p1
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-policyflow}
      DB_USER: ${POSTGRES_USER:-policyflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-policyflow-dev}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      LISTEN_PORT: 6432
    ports:
      - "${PGBOUNCER_PORT:-6432}:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U $$DB_USER -d $$DB_NAME"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-policyflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-policyflow-dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - policyflow-rabbitmq:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - policyflow-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=default=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=policyflow-etcd
      - --name=default
    volumes:
      - policyflow-etcd:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    # Upstream `minio/minio` and `minio/mc` on Docker Hub (and quay.io/minio/*)
    # now answer anonymous pulls with 401/"pull access denied", so the pinned
    # RELEASE.2025-05-24T17-08-30Z tag is no longer fetchable on a clean host.
    # `bitnamilegacy/minio:2025.5.24` is the *same* MinIO build (the server
    # reports 2025-05-24T17-08-30Z) and bundles `mc` 2025-05-21, so both the
    # server and the init step below keep their original versions. Bitnami
    # conventions differ from upstream: no `server` command is passed (the
    # image's own entrypoint starts it), the data dir is /bitnami/minio/data,
    # and the `local` mc alias is pre-configured, which is what `mc ready local`
    # in the healthcheck relies on.
    image: bitnamilegacy/minio:2025.5.24
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-policyflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-policyflow-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - policyflow-minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    # Same image as the server because it ships the `mc` client; the dedicated
    # `minio/mc` image is no longer anonymously pullable (see the note above).
    # Object-store *versioning* is a hard Stage-5 requirement
    # (OBJECT_STORE_VERSIONING_REQUIRED): physical deletion must be able to
    # remove every object version and delete marker, so the bucket is useless to
    # us unversioned.
    image: bitnamilegacy/minio:2025.5.24
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set target http://minio:9000 "$${MINIO_ROOT_USER}"
        "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "target/$${OBJECT_STORE_BUCKET}" &&
        mc version enable "target/$${OBJECT_STORE_BUCKET}" &&
        mc version info "target/$${OBJECT_STORE_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-policyflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-policyflow-dev-secret}
      OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-policyflow-materials}
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  milvus:
    image: milvusdb/milvus:v2.5.15
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus keeps its own segment/index objects in MinIO under a separate
      # bucket (`a-bucket`, auto-created) and must authenticate as the same root
      # identity the compose stack configures; without these it falls back to the
      # `minioadmin` default and never reaches healthy.
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-policyflow}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-policyflow-dev-secret}
      MINIO_USE_SSL: "false"
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - policyflow-milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:13133/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  policyflow-postgres:
  policyflow-rabbitmq:
  policyflow-redis:
  policyflow-etcd:
  policyflow-minio:
  policyflow-milvus:
