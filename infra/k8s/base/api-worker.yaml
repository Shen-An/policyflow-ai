apiVersion: v1
kind: ConfigMap
metadata:
  name: policyflow-runtime
data:
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  DATABASE_ECHO: "false"
  CELERY_TASK_IGNORE_RESULT: "true"
  CELERY_TASK_DEFAULT_QUEUE: policyflow.default
  CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
  CELERY_TASK_ACKS_LATE: "true"
  REDIS_KEY_PREFIX: policyflow
  RAG_WORKSPACE_DIR: /var/lib/policyflow/rag-workspaces
  UPLOAD_DIR: /var/lib/policyflow/uploads
  OTEL_SERVICE_NAME: policyflow-api
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyflow-api
  labels:
    app.kubernetes.io/name: policyflow
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policyflow
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policyflow
        app.kubernetes.io/component: api
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: policyflow:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: policyflow-runtime
            - secretRef:
                name: policyflow-secrets
                optional: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /var/lib/policyflow
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: policyflow-api
  labels:
    app.kubernetes.io/name: policyflow
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: policyflow
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: policyflow-worker
  labels:
    app.kubernetes.io/name: policyflow
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: policyflow
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: policyflow
        app.kubernetes.io/component: worker
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: policyflow:dev
          imagePullPolicy: IfNotPresent
          command: ["celery"]
          args:
            - "-A"
            - backend.app.jobs.celery_app
            - worker
            - --loglevel=INFO
            - --concurrency=1
            - --prefetch-multiplier=1
          envFrom:
            - configMapRef:
                name: policyflow-runtime
            - secretRef:
                name: policyflow-secrets
                optional: true
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "celery -A backend.app.jobs.celery_app control shutdown || true; sleep 20"]
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "celery -A backend.app.jobs.celery_app inspect ping --timeout=3 >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "celery -A backend.app.jobs.celery_app inspect ping --timeout=3 >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "celery -A backend.app.jobs.celery_app inspect ping --timeout=3 >/dev/null"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-data
              mountPath: /var/lib/policyflow
      volumes:
        - name: tmp
          emptyDir: {}
        - name: app-data
          emptyDir: {}

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyflow-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyflow-api
  minReplicas: 1
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: policyflow-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: policyflow-worker
  minReplicas: 1
  maxReplicas: 8
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
