        limit: {type: integer, minimum: 1}
        offset: {type: integer, minimum: 0}
    Problem:
      type: object
      description: >-
        Runtime error envelope used by every v2 failure. This is not RFC 9457:
        the application handler emits ``{"success": false, "error": {...},
        "request_id": ...}`` and the ``application/json`` media type.
      required: [success, error, request_id]
      properties:
        success: {type: boolean, const: false}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            details:
              description: Structured, request-appropriate validation/authorization detail.
        request_id: {type: [string, 'null']}
