openapi: 3.1.0
info:
  title: PolicyFlow Enterprise Run and File Workflow API
  version: 2.1.0-draft
  description: >-
    Draft contract for the running v2 tenant-scoped API (Chat/Eval runs, file
    workflows, workspaces and tenant administration). The path set mirrors
    ``create_app(Settings(...)).openapi()``; every path below is mounted under
    the ``/api/v2`` server prefix. Legacy (non-v2) chat APIs are temporary
    adapters and are deliberately out of scope here.
servers:
  - url: /api/v2
security:
  - bearerAuth: []
tags:
  - name: Runs
  - name: Approvals
  - name: Files
  - name: Workspaces
  - name: Principal
  - name: Admin
paths:
  /runs:
    post:
      tags: [Runs]
      operationId: createRun
      summary: Enqueue a durable run for the caller's tenant
      description: >-
        The Idempotency-Key header is read by the route and required by it: a
        missing or malformed key (outside 16..128 characters) is a 400
        ``IDEMPOTENCY_KEY_INVALID`` before any work is enqueued. A repeat of the
        same (tenant, kind, key) with a different payload is a 409
        ``IDEMPOTENCY_KEY_CONFLICT``; the same payload returns the existing run.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: Run accepted or the existing run returned for this key
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/Overloaded'}
        '503': {$ref: '#/components/responses/Overloaded'}
  /runs/{run_id}:
    get:
      tags: [Runs]
      operationId: getRun
      summary: Read one run the caller's tenant owns
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Tenant-authorized run snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/events:
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Stream ordered run events with bounded replay
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: string}
      responses:
        '200':
          description: >-
            text/event-stream. Each event has id equal to event_id, event equal
            to type and data equal to a RunEvent JSON object. If replay expired,
            the stream starts with a run.snapshot event.
          content:
            text/event-stream:
              schema:
                type: string
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /runs/{run_id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Request cooperative cancellation of a run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Cancellation intent persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /runs/{run_id}/approvals/{approval_id}:
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Approve or reject one approval for the caller's tenant
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: Decision recorded; execution remains subject to RBAC and digest recheck
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /materials:
    post:
      tags: [Files]
      operationId: createMaterialUpload
      summary: Declare an upload and receive a scoped transfer grant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateMaterialRequest'}
      responses:
        '201':
          description: Upload declaration with a short-lived constrained grant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaterialUpload'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413':
          description: Declared material exceeds the configured size ceiling
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
        '415':
          description: Media type is outside the configured allowlist
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '503':
          description: Material indexing is not configured on this deployment
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Problem'}
  /principal:
    get:
      tags: [Principal]
      operationId: readPrincipal
      summary: Return the caller's own principal derived from stored membership
      responses:
        '200':
          description: The caller's own tenant, user, membership, roles and scopes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Principal'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /workspaces:
    post:
      tags: [Workspaces]
      operationId: createWorkspace
      summary: Create a workspace selecting authorized material versions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WorkspaceCreateRequest'}
      responses:
        '201':
          description: Workspace created with its selected immutable inputs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /workspaces/{workspace_id}:
    get:
      tags: [Workspaces]
      operationId: getWorkspace
      summary: Read one workspace and its selected inputs
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace view; no storage keys or host paths are exposed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Workspace'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace_id}/changes/{change_set_id}:
    get:
      tags: [Workspaces]
      operationId: getChangeSet
      summary: Return a change set and its items for diff preview
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ChangeSetId'
      responses:
        '200':
          description: Change set summary and normalized relative-path items
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChangeSet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /workspaces/{workspace_id}/submissions/{submission_id}:
    get:
      tags: [Workspaces]
      operationId: getSubmission
      summary: Return a submission result and sanitized receipt
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/SubmissionId'
      responses:
        '200':
          description: Submission status and sanitized result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/roles:
    get:
      tags: [Admin]
      operationId: listAdminRoles
      summary: List this tenant's roles with active grant counts
      responses:
        '200':
          description: Roles visible in the caller's tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminRoleList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/grants:
    get:
      tags: [Admin]
      operationId: listAdminGrants
      summary: List grants in this tenant, optionally filtered to one member
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: member_id
          in: query
          required: false
          description: Filter by the granted member; this is not an identity claim.
          schema: {type: string, maxLength: 36}
      responses:
        '200':
          description: Page of grants plus the effective paging window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
    post:
      tags: [Admin]
      operationId: createAdminGrant
      summary: Grant one role to one member of this tenant
      description: >-
        Provide exactly one of role_id or role_code. A repeat of an identical
        active grant returns ``created: false``. Granting actions the operator
        does not hold is a 403; a role/member outside the tenant is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantCreateRequest'}
      responses:
        '201':
          description: Grant created, or the existing active grant returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantCreateResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/grants/{grant_id}/revoke:
    post:
      tags: [Admin]
      operationId: revokeAdminGrant
      summary: Revoke a grant; a repeat is an idempotent no-op
      parameters:
        - $ref: '#/components/parameters/GrantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantRevokeRequest'}
      responses:
        '200':
          description: "Grant revoked, or already revoked (revoked: false)"
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GrantRevokeResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/quota:
    get:
      tags: [Admin]
      operationId: getAdminQuota
      summary: Return effective quota policies, usage totals and live leases
      responses:
        '200':
          description: Effective quota summary for the caller's tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QuotaSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/health:
    get:
      tags: [Admin]
      operationId: getAdminHealth
      summary: Return tenant-scoped queue, indexing, submission and drift health
      responses:
        '200':
          description: Grouped health counts and oldest queued timestamp
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/runs:
    get:
      tags: [Admin]
      operationId: listAdminRuns
      summary: List this tenant's runs, newest first
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: status
          in: query
          required: false
          schema: {type: string, maxLength: 30}
        - name: kind
          in: query
          required: false
          schema: {type: string, maxLength: 30}
      responses:
        '200':
          description: Page of runs plus the effective paging window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/runs/{run_id}/audit:
    get:
      tags: [Admin]
      operationId: getAdminRunAudit
      summary: Return one run's correlated, redacted audit timeline
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Merge of audit decisions and durable run events by time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunTimeline'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/runs/{run_id}/recover:
    post:
      tags: [Admin]
      operationId: recoverAdminRun
      summary: Requeue a recoverable-failed run
      description: >-
        Only ``recoverable_failed`` may be requeued (anything else is a 409
        ``RUN_NOT_RECOVERABLE``). When the attempt budget is spent the caller
        must pass ``extend_attempts: true`` or receives a 409
        ``RUN_ATTEMPTS_EXHAUSTED``.
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRecoveryRequest'}
      responses:
        '200':
          description: Run requeued with its new attempt/version window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecoveryResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/reconciliation:
    get:
      tags: [Admin]
      operationId: listAdminReconciliation
      summary: List cross-store findings (fingerprints only)
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
        - name: state
          in: query
          required: false
          schema: {type: string, maxLength: 20}
        - name: issue_kind
          in: query
          required: false
          schema: {type: string, maxLength: 30}
      responses:
        '200':
          description: Page of findings plus the effective paging window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/reconciliation/{issue_id}/retry:
    post:
      tags: [Admin]
      operationId: retryAdminReconciliation
      summary: Reopen a finding with a fresh attempt budget
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconciliationRetryRequest'}
      responses:
        '200':
          description: Finding reopened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationRetryResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/reconciliation/{issue_id}/resolve:
    post:
      tags: [Admin]
      operationId: resolveAdminReconciliation
      summary: Close a finding with an operator-supplied resolution note
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReconciliationResolveRequest'}
      responses:
        '200':
          description: Finding resolved
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationResolveResult'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /admin/capacity:
    get:
      tags: [Admin]
      operationId: listAdminCapacity
      summary: List platform capacity runs; requires cross_tenant_admin
      parameters:
        - $ref: '#/components/parameters/PageLimit'
        - $ref: '#/components/parameters/PageOffset'
      responses:
        '200':
          description: Page of capacity evidence plus the effective paging window
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapacityList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationError'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string}
    WorkspaceId:
      name: workspace_id
      in: path
      required: true
      schema: {type: string}
    ChangeSetId:
      name: change_set_id
      in: path
      required: true
      schema: {type: string}
    SubmissionId:
      name: submission_id
      in: path
      required: true
      schema: {type: string}
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: {type: string}
    IssueId:
      name: issue_id
      in: path
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required by POST /runs. A missing or out-of-range key is rejected with
        400 IDEMPOTENCY_KEY_INVALID before any work is enqueued.
      schema: {type: string, minLength: 16, maxLength: 128}
    PageLimit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    PageOffset:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    BadRequest:
      description: Request shape is valid but a required header or value is invalid
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Missing, malformed or expired bearer credential
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: The caller lacks the required authority or scope
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource does not exist or is not visible to this principal
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State, version, digest or idempotency conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Overloaded:
      description: Bounded capacity reached; response includes Retry-After
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    CreateRunRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, minLength: 1, maxLength: 80}
        payload:
          type: object
          default: {}
        priority_lane: {type: string, maxLength: 40, default: default}
        max_attempts: {type: integer, minimum: 1, maximum: 50, default: 5}
    Run:
      type: object
      required:
        - run_id
        - job_id
        - tenant_id
        - kind
        - state
        - attempts
        - max_attempts
        - idempotency_key
        - priority_lane
        - created_at
      properties:
        run_id: {type: string}
        job_id: {type: string}
        tenant_id: {type: string}
        kind: {type: string}
        state:
          type: string
          enum:
            - queued
            - leased
            - running
            - cancel_requested
            - succeeded
            - recoverable_failed
            - terminal_failed
            - cancelled
        attempts: {type: integer, minimum: 0}
        max_attempts: {type: integer, minimum: 1}
        idempotency_key: {type: [string, 'null']}
        priority_lane: {type: string}
        created_at: {type: string, format: date-time}
    RunEvent:
      type: object
      required: [contract_version, event_id, run_id, sequence, type, stage, status, occurred_at]
      properties:
        contract_version: {type: string, const: '2.0'}
        event_id: {type: string}
        run_id: {type: string}
        sequence: {type: integer, minimum: 0}
        type:
          type: string
          enum: [run.snapshot, stage.started, stage.completed, evidence.ready, approval.required, output.delta, run.completed, run.failed, heartbeat]
        stage: {type: string}
        status: {type: string}
        payload:
          type: object
          description: Sanitized event payload; never contains credentials, host paths or cross-tenant identifiers
        occurred_at: {type: string, format: date-time}
    WorkspaceManifest:
      type: object
      additionalProperties: false
      required: [input_version_ids]
      properties:
        input_version_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string}
        intended_action:
          type: string
          enum: [draft, compare, prepare_submission]
        destination_id: {type: [string, 'null']}
    ApprovalDecision:
      type: object
      required: [decision, action_digest, expected_version]
      properties:
        decision: {type: string, enum: [approve, reject]}
        action_digest: {type: string, pattern: '^[a-f0-9]{64}$'}
        expected_version: {type: integer, minimum: 1}
        reason: {type: [string, 'null'], maxLength: 1000}
    Approval:
      type: object
      required: [approval_id, run_id, status, decided_by, decided_at, version]
      properties:
        approval_id: {type: string}
        run_id: {type: string}
        status:
          type: string
          enum: [pending, approved, rejected, expired, invalidated, consumed]
        decided_by: {type: [string, 'null']}
        decided_at: {type: [string, 'null'], format: date-time}
        version: {type: integer, minimum: 1}
    CreateMaterialRequest:
      type: object
      required: [knowledge_base_id, filename, size_bytes, sha256, media_type, purpose]
      properties:
        knowledge_base_id: {type: string, minLength: 1, maxLength: 36}
        filename: {type: string, minLength: 1, maxLength: 255}
        size_bytes: {type: integer, minimum: 1}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        media_type: {type: string, minLength: 1, maxLength: 180}
        purpose: {type: string, enum: [task_input, policy_import]}
        material_id:
          type: [string, 'null']
          maxLength: 36
          description: Supplying this appends a new immutable version of an existing material.
    MaterialUpload:
      type: object
      required: [material_id, material_version_id, version_number, purpose, upload]
      properties:
        material_id: {type: string}
        material_version_id: {type: string}
        version_number: {type: integer, minimum: 1}
        purpose: {type: string, enum: [task_input, policy_import]}
        upload:
          type: object
          required: [method, url, expires_at, max_bytes, media_type, bucket_alias]
          properties:
            method: {type: string}
            url: {type: string}
            expires_at: {type: string, format: date-time}
            max_bytes: {type: integer, minimum: 1}
            media_type: {type: string}
            bucket_alias: {type: string}
    Principal:
      type: object
      required: [tenant_id, user_id, membership_id, roles, scopes, authorization_version]
      properties:
        tenant_id: {type: string}
        user_id: {type: string}
