[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
revision_environment = true

# DATABASE_URL is injected from backend.app.core.config.Settings in env.py.
# Keep credentials out of this file and Alembic logs.
sqlalchemy.url = driver://unused

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
